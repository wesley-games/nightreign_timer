<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightreign Timer</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    h1 {
        margin: 20px 0;
    }

    .container {
        width: 90%;
        max-width: 400px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .timer {
        position: relative;
        border-radius: 15px;
        overflow: hidden;
        background: #333;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: bold;
    }

    .progress {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 100%;
        background: #4cd964; /* verde claro inicial */
        transition: width 1s linear, background 0.5s;
        z-index: 0;
    }

    .time-text {
        position: relative;
        z-index: 1;
    }

    button {
        width: 100%;
        padding: 20px;
        font-size: 1.5rem;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
    }

    #startBtn {
        background: #28a745;
        color: white;
    }

    #continueBtn {
        background: #007bff;
        color: white;
    }

    button:disabled {
        background: #555;
        cursor: not-allowed;
        opacity: 0.6;
    }

    button:active:not(:disabled) {
        transform: scale(0.97);
    }
</style>
</head>

<body>

<h1>Nigthreign Timer</h1>

<div class="container">
    <button id="startBtn">Iniciar</button>

    <div class="timer">
        <div class="progress" id="p1"></div>
        <div class="time-text" id="t1"></div>
    </div>

    <div class="timer">
        <div class="progress" id="p2"></div>
        <div class="time-text" id="t2"></div>
    </div>

    <button id="continueBtn" disabled>Continuar</button>

    <div class="timer">
        <div class="progress" id="p3"></div>
        <div class="time-text" id="t3"></div>
    </div>

    <div class="timer">
        <div class="progress" id="p4"></div>
        <div class="time-text" id="t4"></div>
    </div>
</div>

<script>
    const initialTimes = [270, 180, 270, 180];

    const timers = [
        { time: 270, text: t1, bar: p1 },
        { time: 180, text: t2, bar: p2 },
        { time: 270, text: t3, bar: p3 },
        { time: 180, text: t4, bar: p4 }
    ];

    let current = 0;
    let interval = null;
    let running = false;

    const startBtn = document.getElementById("startBtn");
    const continueBtn = document.getElementById("continueBtn");

    function formatTime(seconds) {
        const m = String(Math.floor(seconds / 60)).padStart(2, '0');
        const s = String(seconds % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    function getColor(percent) {
        if (percent > 0.5) return "#4cd964"; // verde mais claro
        if (percent > 0.2) return "#ffc107"; // amarelo
        return "#dc3545"; // vermelho
    }

    function updateDisplay() {
        timers.forEach((t, i) => {
            const percent = t.time / initialTimes[i];
            t.text.textContent = formatTime(t.time);
            t.bar.style.width = (percent * 100) + "%";
            t.bar.style.background = getColor(percent);
        });
    }

    function resetAll() {
        clearInterval(interval);
        interval = null;
        running = false;
        current = 0;

        timers.forEach((t, i) => {
            t.time = initialTimes[i];
        });

        updateDisplay();
        continueBtn.disabled = true;
        startBtn.textContent = "Iniciar";
    }

    function runTimer(index) {
        clearInterval(interval);

        interval = setInterval(() => {
            if (!running) return;

            if (timers[index].time > 0) {
                timers[index].time--;
                updateDisplay();
            } else {
                clearInterval(interval);

                if (index === 0) {
                    current = 1;
                    runTimer(current);
                } 
                else if (index === 1) {
                    running = false;
                    startBtn.textContent = "Iniciar";
                    continueBtn.disabled = false;
                } 
                else if (index === 2) {
                    current = 3;
                    runTimer(current);
                } 
                else {
                    running = false;
                    startBtn.textContent = "Iniciar";
                }
            }
        }, 1000);
    }

    startBtn.onclick = () => {
        if (!running) {
            running = true;
            startBtn.textContent = "Parar";
            runTimer(current);
        } else {
            resetAll();
        }
    };

    continueBtn.onclick = () => {
        continueBtn.disabled = true;
        current = 2;
        running = true;
        startBtn.textContent = "Parar";
        runTimer(current);
    };

    resetAll();
</script>

</body>
</html>
